name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: trading_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Poetry
      run: pip install poetry

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: poetry install

    - name: Lint with Ruff
      working-directory: ./backend
      run: poetry run ruff check .

    - name: Run Backend Tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/trading_db_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: testsecret
      run: poetry run pytest

    - name: Build Docker Images
      run: docker-compose build
