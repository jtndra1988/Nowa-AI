[alembic]
# Main Alembic scripts folder
script_location = alembic
# Let versions be inside the same folder
# version_locations is optional; remove it if you want default
# version_locations = alembic/versions

sqlalchemy.url = postgresql://nowa:nowa@db:5432/nowa
prepend_sys_path = .
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
