[tool.poetry]
name = "MARS"
version = "0.1.0"
description = "FastAPI backend for ML trading"
authors = ["Jiten <jtndra1988@gmail.com>"]
readme = "README.md"
packages = [{include = "app", from = "."}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "0.109.2"
uvicorn = {extras = ["standard"], version = "0.27.1"}
psycopg = { extras = ["binary"], version = "^3.1" }
sqlalchemy = "2.0.27"
psycopg2-binary = "2.9.9"
alembic = "1.13.1"
celery = {extras = ["redis"], version = "5.3.6"}
redis = "5.0.1"
pydantic-settings = "2.1.0"
requests = "2.31.0"
yfinance = "^0.2.40"
pandas = "2.2.2"
numpy = "1.26.4"
scipy = "1.12.0"
vaderSentiment = "3.3.2"
prometheus-fastapi-instrumentator = "6.1.0"
starlette-exporter = "0.20.0"
apscheduler = "3.10.4"
colorlog = "6.8.2"
ccxt = "^4.3"
transformers = "^4.45.0"
psutil = "^5.9.8"
stable-baselines3 = {extras = ["extra"], version = "*"}
gym = "0.26.2" 
# --- ADDED NEW ML DEPENDENCIES ---
torch = "^2.2.0"
xgboost = "^2.0.3"
joblib = "^1.3.2"
google-generativeai = "^0.5.4"
gymnasium = "^0.29.1"
stable-baselines3 = {extras = ["extra"], version = "^2.3.2"}
# ----------------------------------

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"
ruff = "^0.2.1"
mypy = "^1.8.0"
black = "^24.1.1"

[tool.poetry.scripts]
start = "app.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"