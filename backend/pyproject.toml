[tool.poetry]
name = "MARS"
version = "0.1.0"
description = "AI Crypto Options Trading Bot Backend"
authors = ["Jiten <jtndra1988@gmail.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<=3.12.6"
fastapi = "^0.111.0"
pydantic-settings = "^2.0.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
orjson = "^3.10.7"
uvloop = {version="^0.19.0", markers="sys_platform != 'win32'"}
sqlalchemy = "^2.0.31"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.2"
python-dateutil = "^2.9.0.post0"
celery = {version="^5.4.0", extras=["redis"]}
redis = "^5.0.7"
tenacity = "^9.0.0"
pandas = "^2.2.2"
numpy = "<2.0.0"
scikit-learn = "^1.5.1"
xgboost = "^2.1.1"
torch = "^2.4.0"
torchvision = "^0.19.0"
torchaudio = "^2.4.0"
optuna = "^3.6.1"
tqdm = "^4.66.4"
yfinance = "^0.2.40"
matplotlib = "^3.7.0"
transformers = "^4.44.2"
tokenizers = "^0.19.1"
ccxt = "^4.3.89"
httpx = "^0.27.0"
loguru = "^0.7.2"
prometheus-client = "^0.20.0"
starlette-exporter= "0.23.0"
[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.23.8"
black = "^24.8.0"
ruff = "^0.6.8"
mypy = "^1.11.2"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"